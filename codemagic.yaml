workflows:
  android-preview:
    name: TaruGuardians Android (Preview APK)
    max_build_duration: 120
    environment:
      vars:
        PACKAGE_NAME: "com.taruguardians.app"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Copy splash screen drawable
        script: |
          DRAWABLE_DIR="android/app/src/main/res/drawable"
          mkdir -p "$DRAWABLE_DIR"
          cp assets/splash.png "$DRAWABLE_DIR/splashscreen_logo.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DENSITY_DIR="android/app/src/main/res/drawable-$density"
            mkdir -p "$DENSITY_DIR"
            cp assets/splash.png "$DENSITY_DIR/splashscreen_logo.png"
          done
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - user_one@example.com
        notify:
          success: true
          failure: true

  android-release:
    name: TaruGuardians Android (Release APK)
    max_build_duration: 120
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.taruguardians.app"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Copy splash screen drawable
        script: |
          DRAWABLE_DIR="android/app/src/main/res/drawable"
          mkdir -p "$DRAWABLE_DIR"
          cp assets/splash.png "$DRAWABLE_DIR/splashscreen_logo.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DENSITY_DIR="android/app/src/main/res/drawable-$density"
            mkdir -p "$DENSITY_DIR"
            cp assets/splash.png "$DENSITY_DIR/splashscreen_logo.png"
          done
      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - user_one@example.com
        notify:
          success: true
          failure: true

  react-native-ios:
    name: TaruGuardians iOS
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.taruguardians.app
      vars:
        BUNDLE_ID: "com.taruguardians.app"
        XCODE_WORKSPACE: "TaruGuardians.xcworkspace"
        XCODE_SCHEME: "TaruGuardians"
        APP_STORE_APPLE_ID: 1234567890
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - group name
        submit_to_app_store: false
      email:
        recipients:
          - user_one@example.com
        notify:
          success: true
          failure: false
